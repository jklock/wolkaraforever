name: Repository checks

# What this pipeline is: the layer's gates - the split, the patches, the overlay,
# the documentation and the string tables. What it is not: a build, a test run, or
# anything that needs a simulator or a device. Those are local (`docs/BUILDING.md`,
# `validate.sh`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Layer and documentation gates
    # The gates run prepare.sh, so they need macOS. They do not need Apple
    # silicon: the Intel image is the one with capacity. On macos-26 the job
    # was never handed to a runner - "not acquired by Runner of type hosted
    # even after multiple attempts" - and every run ended cancelled after
    # queueing, which is why this was red for every commit since #121.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch the pinned upstream tree
        run: |
          pin=$(git log --grep='^git-subtree-dir: platform$' -n 1 --format=%B | sed -n 's/^git-subtree-split: //p')
          test -n "$pin" || { echo "No pinned platform commit recorded"; exit 1; }
          git remote add upstream https://github.com/tolkara/tolkara.git
          git fetch --quiet upstream "$pin"
          git update-ref refs/remotes/upstream/main "$pin"

      # check_docs.sh ends by running check_agent_docs.sh, so one command runs
      # both documentation gates and neither can be forgotten.
      - run: wolkaraforever/tools/check_docs.sh
      - run: python3 wolkaraforever/tools/check_localization.py
      - run: wolkaraforever/tools/check_layers.sh

