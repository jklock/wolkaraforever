# Explicit experimental packaging for an existing tag; no automatic public IPA.

name: Experimental IPA (manual)

# WolkaraForever is currently published as source. Packaging an experimental External
# JIT IPA is an explicit maintainer action, never an automatic tag/release side effect.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the unsigned .ipa for"
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # create or edit the release, upload the .ipa
  issues: read # credit reporters of issues closed by released pull requests
  pull-requests: read # credit authors of pull requests associated with released commits

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  IPA: Tolkara-unsigned.ipa
  MARKER: "<!-- generated by .github/workflows/release.yml -->"

jobs:
  ipa:
    name: Unsigned .ipa
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          # Full history: the notes list commits since the previous tag.
          fetch-depth: 0

      - name: Decide whether there is anything to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Finished by the other event's run; by hand always rebuilds.
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          body=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if printf '%s' "$body" | grep -qF "$MARKER" && printf '%s\n' "$assets" | grep -qx "$IPA"; then
            echo "$TAG already carries its notes and $IPA."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.plan.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Build the unsigned .ipa
        if: steps.plan.outputs.skip != 'true'
        # Published, so nothing exported from the runner's macOS goes in.
        run: TOLKARA_SYSTEM_ROOTS=NO wolkaraforever/tools/package_ipa.sh "$IPA"

      - name: Write the release notes
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start from the release's description, or the tag's message.
          if ! gh release view "$TAG" --json body --jq .body > body.md 2>/dev/null; then
            if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = tag ]; then
              git tag -l --format='%(contents)' "$TAG" > body.md
            else
              : > body.md
            fi
          fi
          # Above the marker is kept, below is ours; normalise CRLF.
          tr -d '\r' < body.md \
            | awk -v marker="$MARKER" 'index($0, marker) { exit } { print }' \
            | awk 'NF { last = NR } { line[NR] = $0 } END { for (i = 1; i <= last; i++) print line[i] }' \
            > notes.md

          # The previous tag: "$TAG^" keeps it off its own list.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          URL=${{ github.server_url }}/${{ github.repository }}
          git log --no-merges --format="- [\`%h\`]($URL/commit/%H) %s" "${PREV:+$PREV..}$TAG" > commits.md
          TOTAL=$(wc -l < commits.md | tr -d ' ')

          # Git does not retain issue authors or PR authors after a squash merge. Resolve
          # them from GitHub's commit associations so every generated release credits both
          # the people whose PRs shipped and reporters of issues those PRs close.
          : > credits.tsv
          credit_query='query($owner: String!, $name: String!, $oid: GitObjectID!) {
            repository(owner: $owner, name: $name) {
              object(oid: $oid) {
                ... on Commit {
                  associatedPullRequests(first: 20) {
                    nodes {
                      number title url mergedAt author { login url }
                      closingIssuesReferences(first: 100) {
                        nodes { number title url author { login url } }
                      }
                    }
                  }
                }
              }
            }
          }'
          git log --no-merges --format=%H "${PREV:+$PREV..}$TAG" | while IFS= read -r oid; do
            gh api graphql -f query="$credit_query" \
              -f owner="${GITHUB_REPOSITORY_OWNER}" \
              -f name="${GITHUB_REPOSITORY#*/}" \
              -F oid="$oid" > credit.json
            jq -r '.data.repository.object.associatedPullRequests.nodes[]?
              | select(.mergedAt != null)
              | . as $pr
              | (["pr", $pr.number, ($pr.author.login // ""), ($pr.author.url // ""), $pr.title, $pr.url] | @tsv),
                ($pr.closingIssuesReferences.nodes[]?
                  | ["issue", .number, (.author.login // ""), (.author.url // ""), .title, .url] | @tsv)' credit.json >> credits.tsv
          done
          sort -u credits.tsv -o credits.tsv

          {
            if [ -s notes.md ]; then echo; fi
            echo "$MARKER"
            echo "---"
            echo
            echo "\`$IPA\` is an unsigned build: your sideloading app signs it with your own Apple ID. It is meant for External JIT mode and is a convenience; the supported way to use Tolkara is to [build it yourself]($URL/blob/$TAG/docs/BUILDING.md). What it can and cannot do is in the [README]($URL#readme)."
            echo
            echo "**Install on your iPad** — copy the line for your sideloading app into Safari. GitHub drops links that are not https, so these are text to copy, not links:"
            echo
            echo "- SideStore: \`sidestore://install?url=$URL/releases/download/$TAG/$IPA\`"
            echo "- LiveContainer: \`livecontainer://install?url=$URL/releases/download/$TAG/$IPA\`"
            echo
            if [ -s credits.tsv ]; then
              echo "**Contributors**"
              echo
              while IFS=$'\t' read -r kind number login profile title item_url; do
                safe_title=$(printf '%s' "$title" | sed 's/\\/\\\\/g; s/]/\\]/g')
                if [ -n "$login" ] && [ -n "$profile" ]; then
                  person="[@$login]($profile)"
                elif [ -n "$login" ]; then
                  person="@$login"
                else
                  person="an unlinked GitHub contributor"
                fi
                if [ "$kind" = pr ]; then
                  echo "- $person — [#$number]($item_url): $safe_title"
                else
                  echo "- $person — reported [#$number]($item_url): $safe_title"
                fi
              done < credits.tsv
              echo
            fi
            if [ -n "$PREV" ]; then
              echo "**Commits since $PREV:**"
            else
              echo "**Commits** (first release):"
            fi
            echo
            # A release description holds 125,000 characters; keep well inside it.
            head -n 200 commits.md
            if [ "$TOTAL" -gt 200 ]; then
              echo "- … and $((TOTAL - 200)) more"
            fi
            if [ -n "$PREV" ]; then
              echo
              echo "[Full diff]($URL/compare/$PREV...$TAG)"
            fi
          } >> notes.md

      - name: Publish
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" "$IPA" --clobber

      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
