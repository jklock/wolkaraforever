name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: wolkaraforever/tools/check_docs.sh

  layer-integrity:
    name: Layer integrity
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch the pinned upstream reference
        run: |
          git remote add upstream https://github.com/tolkara/tolkara.git
          git fetch --no-tags upstream main
      - name: Install project generation dependency
        run: brew install xcodegen
      - run: wolkaraforever/tools/check_layers.sh
