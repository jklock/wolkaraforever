name: Device compatibility report
description: Record an installed-app or gameplay observation with its exact evidence scope.
title: "[Compatibility]: "
labels: [needs-device]
body:
  - type: input
    id: sha
    attributes:
      label: Source SHA
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and iPadOS
      description: Do not include the device identifier.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client build and execution mode
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
